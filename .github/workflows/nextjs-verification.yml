name: Next.js Verification

on:
  push:
    branches:
      - nextjs-16-migration
  pull_request:
    branches:
      - main
      - nextjs-16-migration

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
